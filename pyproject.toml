# Tooling configuration for the Growatt Modbus integration.
# Lint (ruff) and type-check (mypy) settings live here so both CI and local
# runs share one source of truth.

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors + warnings (E/W), import sorting (I),
# pyupgrade (UP) and bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]
# E501 (line-too-long) is deliberately not enforced yet: ~175 existing lines
# exceed the limit above, almost all of them in the hand-aligned register and
# entity-description tables. Reflowing them belongs in its own `ruff format`
# commit rather than being mixed into unrelated changes. `line-length` above
# still applies to anything ruff does format.
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
# homeassistant / pymodbus / voluptuous don't ship type stubs in this env.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# The whole integration is mypy-clean and checked in CI.
files = ["custom_components/growatt_modbus"]
