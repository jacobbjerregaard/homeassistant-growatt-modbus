# Tooling configuration for the Growatt Modbus integration.
# Lint (ruff) and type-check (mypy) settings live here so both CI and local
# runs share one source of truth.

[tool.ruff]
# Deliberately below the interpreter CI runs on. hacs.json claims support
# back to HA 2024.6, which ships Python 3.12, and `ruff format` emits
# syntax for this target - at py314 it rewrote `except (A, B):` into the
# PEP 758 form, which is a SyntaxError on 3.12 and 3.13.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors + warnings (E/W), import sorting (I),
# pyupgrade (UP) and bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]
# The codebase is `ruff format`-clean, so E501 is enforced rather than
# ignored. Run `ruff format .` before committing.

[tool.mypy]
python_version = "3.14"
# homeassistant / pymodbus / voluptuous don't ship type stubs in this env.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# The whole integration is mypy-clean and checked in CI.
files = ["custom_components/growatt_modbus"]
